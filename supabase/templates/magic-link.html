<!-- Biblo's sign-in email. Paste into Supabase dashboard:
     Authentication -> Emails -> Magic Link (subject below), or apply
     via the management API (mailer_templates_magic_link_content).
     Subject: Your way into Biblo -->
<div style="margin:0;padding:0;background:#b8bda6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#b8bda6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#e3e2d4;border:1px solid #a8ad96;">
          <tr>
            <td style="padding:36px 32px 8px;font-family:Arial,Helvetica,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:middle;"><img src="https://biblo-eight.vercel.app/brand/logo-email.png" width="34" height="34" alt="" style="display:block;"/></td><td style="vertical-align:middle;padding-left:6px;font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#16180f;">biblo</td></tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 0;font-family:Arial,Helvetica,sans-serif;">
              <p style="margin:0;font-size:17px;line-height:1.5;color:#16180f;">
                Here is your way in. The button signs you straight into your books &#8212; no password, nothing to remember.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                 style="display:block;background:#16180f;color:#e3e2d4;text-decoration:none;text-align:center;padding:16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">
                Open Biblo
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 36px;font-family:Arial,Helvetica,sans-serif;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#5c5f4e;">
                The link works once and expires in an hour. If you did not ask for it, ignore this email and nothing happens.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#4b4e3f;">
          Tell it what you spent. It keeps the score.
        </p>
      </td>
    </tr>
  </table>
</div>
